<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>DeepSeek</title>
    <script>
      /* 兼容补丁：Android 系统 WebView 常年不更新（不少国产 ROM 停在 Chrome 7x-9x），
         下列 API 在旧内核里缺失，一旦在渲染期被调用就会抛 TypeError，
         React 18 没有错误边界时会卸载整棵树 → 页面全白。
         全部用 ES5 实现，只补缺失的，已有的绝不覆盖。 */
      (function () {
        function def(obj, name, fn) {
          try {
            Object.defineProperty(obj, name, {
              value: fn,
              writable: true,
              configurable: true,
              enumerable: false
            })
          } catch (e) {
            try {
              obj[name] = fn
            } catch (e2) {}
          }
        }
        if (!Object.hasOwn) {
          def(Object, 'hasOwn', function (o, k) {
            return Object.prototype.hasOwnProperty.call(o, k)
          })
        }
        if (!Array.prototype.at) {
          def(Array.prototype, 'at', function (i) {
            var n = this.length
            var k = i < 0 ? n + i : i
            return k < 0 || k >= n ? undefined : this[k]
          })
        }
        if (!String.prototype.at) {
          def(String.prototype, 'at', function (i) {
            var s = String(this)
            var n = s.length
            var k = i < 0 ? n + i : i
            return k < 0 || k >= n ? undefined : s.charAt(k)
          })
        }
        if (!Array.prototype.findLast) {
          def(Array.prototype, 'findLast', function (fn, thisArg) {
            for (var i = this.length - 1; i >= 0; i--) {
              if (fn.call(thisArg, this[i], i, this)) return this[i]
            }
            return undefined
          })
        }
        if (!Array.prototype.findLastIndex) {
          def(Array.prototype, 'findLastIndex', function (fn, thisArg) {
            for (var i = this.length - 1; i >= 0; i--) {
              if (fn.call(thisArg, this[i], i, this)) return i
            }
            return -1
          })
        }
        if (!Array.prototype.toReversed) {
          def(Array.prototype, 'toReversed', function () {
            return Array.prototype.slice.call(this).reverse()
          })
        }
        if (!Array.prototype.toSorted) {
          def(Array.prototype, 'toSorted', function (cmp) {
            var a = Array.prototype.slice.call(this)
            a.sort(cmp)
            return a
          })
        }
        if (!String.prototype.replaceAll) {
          def(String.prototype, 'replaceAll', function (pat, rep) {
            if (pat instanceof RegExp) return String(this).replace(pat, rep)
            return String(this).split(String(pat)).join(String(rep))
          })
        }
        if (!window.crypto) {
          try {
            window.crypto = {}
          } catch (e) {}
        }
        if (window.crypto && !window.crypto.randomUUID) {
          def(window.crypto, 'randomUUID', function () {
            var b = new Uint8Array(16)
            if (window.crypto.getRandomValues) {
              window.crypto.getRandomValues(b)
            } else {
              for (var i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256)
            }
            b[6] = (b[6] & 0x0f) | 0x40
            b[8] = (b[8] & 0x3f) | 0x80
            var hex = '0123456789abcdef'
            var out = ''
            for (var j = 0; j < 16; j++) {
              out += hex[(b[j] >> 4) & 15] + hex[b[j] & 15]
              if (j === 3 || j === 5 || j === 7 || j === 9) out += '-'
            }
            return out
          })
        }
        if (!window.queueMicrotask) {
          def(window, 'queueMicrotask', function (fn) {
            Promise.resolve().then(fn)
          })
        }
      })()
    </script>
    <script>
      /* 启动自检：主 bundle 没跑起来时，把原因直接画在屏幕上，而不是留一片白。
         刻意全部使用 ES5 写法 —— 设备内核再旧，这段也必须能执行。 */
      (function () {
        var shown = false
        var errors = []
        function paint(title, detail) {
          if (shown) return
          shown = true
          var box = document.createElement('div')
          box.setAttribute(
            'style',
            'position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483647;' +
              'background:#ffffff;color:#b3261e;font:13px/1.6 monospace;padding:16px;' +
              'overflow:auto;white-space:pre-wrap;word-break:break-word;' +
              '-webkit-user-select:text;user-select:text;-webkit-overflow-scrolling:touch'
          )
          box.textContent =
            'DS Chat 启动失败\n\n' +
            title +
            '\n\n' +
            detail +
            '\n\n内核: ' +
            navigator.userAgent +
            '\n页面: ' +
            location.href
          ;(document.body || document.documentElement).appendChild(box)
        }
        window.__dskBootFail = paint
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target
            if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
              errors.push('资源加载失败: ' + (t.src || t.href))
            } else {
              errors.push(
                '脚本错误: ' +
                  (e.message || e.error) +
                  ' @ ' +
                  (e.filename || '?') +
                  ':' +
                  (e.lineno || 0)
              )
            }
            paint('页面脚本抛错了。', errors.join('\n'))
          },
          true
        )
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason
          errors.push('未处理的 Promise 拒绝: ' + ((r && (r.stack || r.message)) || r))
        })
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (window.__dskMounted) return
            var root = document.getElementById('root')
            paint(
              '前端资源已加载，但 React 没有挂载（#root 子节点: ' +
                (root ? root.childElementCount : '找不到 #root') +
                '）。',
              '常见原因：WebView 内核版本过低，主 bundle 语法不被支持。\n\n捕获到的错误:\n' +
                (errors.length ? errors.join('\n') : '（无）')
            )
          }, 3000)
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
